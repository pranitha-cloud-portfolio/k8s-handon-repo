
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website1
  namespace: demo-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: website1
  template:
    metadata:
      labels:
        app: website1
    spec:
      nodeSelector:
        workload: worker
      containers:
        - name: website
          image: nginx:stable
          ports:
            - containerPort: 80
          volumeMounts:
            - name: website-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: website-content
          configMap:
            name: website1-content
